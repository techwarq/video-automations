<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clep — Features → Clips</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; background: #0c0d10; color: #f5f5f7; }
  header { padding: 22px 32px; border-bottom: 1px solid #26282e; display: flex; align-items: center; gap: 14px; }
  .logo { width: 26px; height: 26px; border-radius: 50%; background: #d6ff3b; }
  h1 { font-size: 20px; margin: 0; } h1 span { color: #d6ff3b; }
  main { padding: 24px 32px 64px; max-width: 1100px; }
  .row { display: flex; gap: 10px; margin: 18px 0; }
  input[type=text], textarea, select { background: #16181d; color: #f5f5f7; border: 1px solid #33363e; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  input[type=text] { flex: 1; }
  button { background: #d6ff3b; color: #0c0d10; border: 0; border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button.ghost { background: #1c1e23; color: #f5f5f7; border: 1px solid #33363e; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 12px; }
  .card { background: #14161b; border: 1px solid #2a2d34; border-radius: 14px; padding: 18px; }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .meta { font-size: 12px; color: #9698a0; margin-bottom: 10px; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { font-size: 11px; background: #22252c; border: 1px solid #34373f; padding: 3px 9px; border-radius: 20px; color: #c9cad0; }
  .chip.live { background: #d6ff3b; color: #0c0d10; border-color: #d6ff3b; font-weight: 700; }
  .card label { font-size: 11px; color: #9698a0; display: block; margin: 8px 0 4px; }
  .card input, .card select, .card textarea { width: 100%; box-sizing: border-box; }
  .card textarea { font-family: monospace; font-size: 11px; min-height: 64px; }
  .card button { width: 100%; margin-top: 12px; }
  .job { background: #14161b; border: 1px solid #2a2d34; border-radius: 14px; padding: 16px 18px; margin-top: 12px; }
  .job video { width: 100%; max-width: 640px; border-radius: 10px; margin-top: 10px; background: #000; }
  .status { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .st-queued, .st-recording, .st-editing { background: #33363e; color: #ffd400; }
  .st-done { background: #d6ff3b; color: #0c0d10; }
  .st-error { background: #5c2020; color: #ff9a9a; }
  a.dl { color: #d6ff3b; font-size: 13px; }
  .hint { color: #9698a0; font-size: 13px; }
  pre.err { color: #ff9a9a; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header><div class="logo"></div><h1>clep <span>· features → clips</span></h1></header>
<main>
  <div class="row">
    <input id="url" type="text" placeholder="https://your-app.com/dashboard">
    <button onclick="scan()">Scan app</button>
    <button class="ghost" onclick="loadRegistry()">Registry</button>
  </div>
  <p class="hint">Instrument once: <code>&lt;button data-clep="ai-research"&gt;</code> — or point the SDK at this platform: <code>data-registry="http://localhost:8787/api/ingest"</code>. Clips render 16:9 from the live recording.</p>
  <h2>Features</h2>
  <div id="features" class="grid"><p class="hint">Scan an app URL, or wait for SDK live reports.</p></div>
  <h2>Clip jobs</h2>
  <div id="jobs"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function loadRegistry() {
  const r = await fetch("/api/registry").then(r => r.json());
  renderFeatures(r.features || []);
}
async function scan() {
  const url = $("url").value.trim();
  if (!url) return alert("Enter an app URL first.");
  $("features").innerHTML = "<p class='hint'>Scanning " + url + " …</p>";
  const r = await fetch("/api/features?url=" + encodeURIComponent(url)).then(r => r.json());
  if (r.error) { $("features").innerHTML = "<pre class='err'>" + r.error + "</pre>"; return; }
  renderFeatures(r.features || [], url);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderFeatures(feats, url) {
  if (!feats.length) { $("features").innerHTML = "<p class='hint'>No features yet.</p>"; return; }
  $("features").innerHTML = feats.map((f, i) => `
    <div class="card">
      <h3>✦ ${esc(f.title || f.name)}</h3>
      <div class="meta">${esc(f.name)} · ${esc(f.url || "")} · via ${esc(f.source || "?")} · ${esc(f.updated || "")}</div>
      <div class="chips">
        ${(f.states || []).map(s => `<span class="chip live">${esc(s)}</span>`).join("")}
        ${f.has_input ? `<span class="chip">input</span>` : ""}
        ${f.has_button ? `<span class="chip">button: ${esc(f.button_label || "")}</span>` : ""}
      </div>
      <label>Query override (optional)</label>
      <input id="q${i}" type="text" placeholder="leave empty for auto">
      <label>Style / fps / quality</label>
      <div style="display:flex;gap:8px">
      <select id="s${i}" style="flex:1"><option>saas</option><option>minimal</option><option>cinematic</option><option>apple</option></select>
      <select id="f${i}" style="width:84px"><option value="60">60fps</option><option value="30">30fps</option></select>
      <select id="r${i}" style="width:96px"><option value="1080p">1080p</option><option value="720p">720p</option></select>
      </div>
      <label>Steps JSON (optional — omit for auto arc)</label>
      <textarea id="t${i}" placeholder='[{"action":"click","target":"primary"},...]'></textarea>
      <button onclick='makeClip(${JSON.stringify(f.url || url || "")}, ${JSON.stringify(f.name)}, ${i})'>Make Clip</button>
    </div>`).join("");
  window._feats = feats;
}

async function makeClip(url, name, i) {
  let steps = undefined;
  const raw = $("t" + i).value.trim();
  if (raw) { try { steps = JSON.parse(raw); } catch (e) { return alert("Steps is not valid JSON: " + e); } }
  const body = { url, name, style: $("s" + i).value, fps: parseInt($("f" + i).value, 10), quality: $("r" + i).value };
  const q = $("q" + i).value.trim();
  if (q) body.query = q;
  if (steps) body.steps = steps.steps || steps;
  const r = await fetch("/api/clips", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) }).then(r => r.json());
  if (r.error) return alert(r.error);
  pollJobs();
}

async function pollJobs() {
  const r = await fetch("/api/jobs").then(r => r.json());
  const box = $("jobs");
  const jobs = r.jobs || [];
  box.innerHTML = jobs.length ? jobs.map(j => `
    <div class="job">
      <span class="status st-${j.status}">${j.status}</span>
      <strong> ${esc(j.name)}</strong>
      <span class="meta"> ${esc(j.id)} · ${esc(j.style || "")}</span>
      ${j.status === "done" ? `<br><video controls src="${j.out}"></video><br><a class="dl" href="${j.out}" download>Download MP4</a>` : ""}
      ${j.status === "error" ? `<pre class="err">${esc(j.error || "")}</pre>` : ""}
    </div>`).join("") : "<p class='hint'>No jobs yet — pick a feature and hit Make Clip.</p>";
}
loadRegistry();
setInterval(pollJobs, 2000);
pollJobs();
</script>
</body>
</html>
